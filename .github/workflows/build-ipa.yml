# Builds the Playgrounds app package into an unsigned .ipa on a free macOS
# runner. Manual trigger only — macOS CI minutes are 10x on private repos,
# so this runs when asked, not on every push.
#
# Install path: download the .ipa artifact from the run page, then sideload
# with AltServer for Windows (signs it with a free Apple ID over USB).
name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Run unit tests
        working-directory: ShutterGlow.swiftpm
        run: |
          # Don't hardcode a simulator name — GitHub rotates which devices
          # ship on the macOS image (this step broke once "iPad (10th
          # generation)" was dropped). Pick the first available iOS simulator
          # at runtime instead.
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v]; print(ids[0] if ids else '')")
          if [ -z "$DEVICE_ID" ]; then
            echo "No iOS simulator available on the runner" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $DEVICE_ID"
          xcodebuild \
            -scheme ShutterGlow \
            -destination "id=$DEVICE_ID" \
            test

      - name: Build (unsigned)
        working-directory: ShutterGlow.swiftpm
        run: |
          xcodebuild \
            -scheme ShutterGlow \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -n 1)
          test -n "$APP_PATH" || { echo "no .app produced"; find build -maxdepth 4; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ShutterGlow-unsigned.ipa Payload
          ls -la ShutterGlow-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShutterGlow-unsigned-ipa
          path: ShutterGlow-unsigned.ipa
          retention-days: 14

# Builds the Playgrounds app package into an unsigned .ipa on a free macOS
# runner. Manual trigger only — macOS CI minutes are 10x on private repos,
# so this runs when asked, not on every push.
#
# Install path: download the .ipa artifact from the run page, then sideload
# with AltServer for Windows (signs it with a free Apple ID over USB).
name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build (unsigned)
        working-directory: Phase0Spike.swiftpm
        run: |
          xcodebuild \
            -scheme Phase0Spike \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -n 1)
          test -n "$APP_PATH" || { echo "no .app produced"; find build -maxdepth 4; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Phase0Spike-unsigned.ipa Payload
          ls -la Phase0Spike-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phase0Spike-unsigned-ipa
          path: Phase0Spike-unsigned.ipa
          retention-days: 14

# Builds a SIGNED .ipa and uploads it to TestFlight.
#
# Deliberately separate from build-ipa.yml rather than replacing it: that
# workflow produces the unsigned artifact used for AltStore sideloading, which
# stays the fallback whenever signing or App Store Connect is having a bad day.
#
# Signing uses an App Store Connect API key rather than an exported .p12
# distribution certificate plus a .mobileprovision file. Same result, far less
# to manage: `-allowProvisioningUpdates` lets Xcode create and download the
# signing assets itself from the key, and the same key authenticates the
# upload, so there are no certificates to rotate by hand and nothing binary in
# the repo secrets beyond the key itself.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   APPSTORE_API_KEY_P8   base64 of the .p8 file downloaded from App Store
#                         Connect. Generate with:  base64 -i AuthKey_XXX.p8
#   APPSTORE_API_KEY_ID   the key's Key ID
#   APPSTORE_ISSUER_ID    the Issuer ID shown above the key list
#   APPLE_TEAM_ID         10-character Team ID from developer.apple.com/account
#
# Prerequisites that must be done once in Apple's web UI or the upload fails
# with an unhelpful error:
#   1. Enrollment shows as active at developer.apple.com/account
#   2. All agreements accepted in App Store Connect > Business
#   3. App ID com.anthonyvo.shutterglow registered
#   4. An app record created in App Store Connect for that bundle ID
name: Release to TestFlight

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # App Store upload now requires the app to be built with the iOS 26
          # SDK (Xcode 26+); a build from Xcode 16.4's iOS 18.5 SDK is rejected
          # at validation. Pick the newest Xcode the runner has rather than
          # pinning a version, so this keeps working as the image updates.
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST=/Applications/Xcode.app; fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Secrets pasted through the GitHub UI very often carry a trailing
          # newline or stray space. That produced an "ambiguous redirect" the
          # first time this ran, because AuthKey_${KEY_ID}.p8 expanded to two
          # words. Strip whitespace from every id here, once, and hand the
          # cleaned values to later steps via GITHUB_ENV so nothing downstream
          # touches the raw secret again. The base64 blob is stripped too:
          # valid base64 contains no whitespace, so removing any pasted
          # newlines is safe and fixes the same class of paste error.
          CLEAN_KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          CLEAN_ISSUER_ID=$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')
          CLEAN_TEAM_ID=$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')

          # altool and xcodebuild both look for the key at this exact path and
          # filename shape, so write it there rather than passing a path around.
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${CLEAN_KEY_ID}.p8"
          printf '%s' "$KEY_P8" | tr -d '[:space:]' | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # Fail loudly now if the decode produced junk, rather than letting
          # xcodebuild fail later with a vaguer signing error.
          if [ ! -s "$KEY_PATH" ]; then
            echo "Decoded key is empty — check the APPSTORE_API_KEY_P8 secret" >&2
            exit 1
          fi

          {
            echo "CLEAN_KEY_ID=$CLEAN_KEY_ID"
            echo "CLEAN_ISSUER_ID=$CLEAN_ISSUER_ID"
            echo "CLEAN_TEAM_ID=$CLEAN_TEAM_ID"
            echo "KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Set build number
        run: |
          # TestFlight rejects a build whose number it has already seen, and
          # Package.swift hardcodes bundleVersion: "1". AppleProductTypes
          # generates the Info.plist at build time, so overriding
          # CURRENT_PROJECT_VERSION on the xcodebuild command line doesn't
          # reach it — rewriting the manifest before the build is the way
          # that actually takes effect.
          cd ShutterGlow.swiftpm
          sed -i '' "s/bundleVersion: \"[^\"]*\"/bundleVersion: \"${GITHUB_RUN_NUMBER}\"/" Package.swift
          grep -n "bundleVersion" Package.swift

      - name: Run unit tests
        working-directory: ShutterGlow.swiftpm
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v]; print(ids[0] if ids else '')")
          if [ -z "$DEVICE_ID" ]; then
            echo "No iOS simulator available on the runner" >&2
            exit 1
          fi
          xcodebuild -scheme ShutterGlow -destination "id=$DEVICE_ID" test

      - name: Archive (signed)
        working-directory: ShutterGlow.swiftpm
        run: |
          # Uses the cleaned values exported by the install step, never the
          # raw secrets, so no downstream step can re-inherit a stray newline.
          xcodebuild \
            -scheme ShutterGlow \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath ../build/ShutterGlow.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$CLEAN_KEY_ID" \
            -authenticationKeyIssuerID "$CLEAN_ISSUER_ID" \
            DEVELOPMENT_TEAM="$CLEAN_TEAM_ID" \
            archive

      - name: Export .ipa
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${CLEAN_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/ShutterGlow.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$CLEAN_KEY_ID" \
            -authenticationKeyIssuerID "$CLEAN_ISSUER_ID"
          ls -la build/export

      - name: Upload to TestFlight
        run: |
          IPA=$(find build/export -name "*.ipa" | head -n 1)
          test -n "$IPA" || { echo "no .ipa exported"; exit 1; }
          # --apiKey resolves against ~/private_keys, which is why the key
          # was written there rather than to a temp path. Cleaned values from
          # the install step, same as every other step.
          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$CLEAN_KEY_ID" \
            --apiIssuer "$CLEAN_ISSUER_ID"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShutterGlow-signed-ipa
          path: build/export/*.ipa
          retention-days: 14
